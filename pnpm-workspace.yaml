packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency lifecycle scripts by default. These packages ship
# prebuilt platform binaries that must be linked during install:
#   - esbuild  : Metro/Vitest bundler
#   - @swc/core: decorator-metadata transform used by the API test runner
#   - unplugin-swc, @swc/*  : same toolchain
#   - nx, @parcel/watcher   : not used by ATHAR, listed defensively below
onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
  - unplugin-swc
