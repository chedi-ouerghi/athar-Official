# Mosquitto derrière Caddy : le TLS est terminé par Caddy (wss://mqtt.DOMAIN)
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# WebSocket, accessible uniquement via Caddy (réseau Docker interne, pas de port publié)
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
max_queued_messages 100
persistent_client_expiration 1h

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
