# Mosquitto, mode TEST SUR PLACE : MQTT simple sur le réseau Docker, sans TLS ni Caddy.
# Utilisé par deploy/docker-compose.local.yml (monté à la place de mosquitto.conf).
# La version cloud (WebSocket derrière Caddy) reste dans mosquitto.conf.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# L'API (conteneur) s'y connecte par `mqtt://mosquitto:1883`.
# Vers l'extérieur, Compose ne le publie que sur 127.0.0.1 du Pi (voir docker-compose.local.yml).
listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/
max_queued_messages 100
persistent_client_expiration 1h

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
