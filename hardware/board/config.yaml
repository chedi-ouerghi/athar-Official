# Athar — config FluidNC STANDARD (non modifié) pour MKS DLC32 V2.x
# Écrite à partir de la doc officielle FluidNC (wiki.fluidnc.com), pas d'un fork.
#
# RÈGLE FluidNC : un commentaire doit être sur SA PROPRE LIGNE. Un commentaire après
# une valeur ("clé: valeur  # texte") fait échouer le chargement du fichier.
#
# Choix d'architecture (différent de Dune Weaver) :
#   - La carte ne connaît PAS le polaire : kinematics Cartesian standard.
#   - Axe X = theta, en DEGRÉS (1 "mm" FluidNC = 1°)
#   - Axe Y = rho, en mm réels du chariot sur le bras
#   - Le Raspberry Pi 5 convertit theta/rho -> G-code et le streame en USB série.
#
# Broches : les broches I2S (i2so.*, bck/ws/data), step/direction des axes X et Y
# et les entrées gpio.36 (limite X) / gpio.35 (limite Y) sont celles de l'exemple
# officiel https://github.com/bdring/fluidnc-config-files/blob/main/official/MKS_DLC32_v21_laser.yaml
# ⚠ À VÉRIFIER SUR TA CARTE avant de brancher les moteurs (ce qui dépend du câblage
# et ne peut pas se lire dans le code) :
#   - le sens des moteurs (sinon ajoute :low à la broche direction_pin) ;
#   - le niveau des fins de course : au repos, "?" ne doit afficher AUCUN "Pn:".
#     S'il affiche Pn:X ou Pn:Y capteur libre, ajoute :low à la broche (gpio.36:low),
#     comme l'exemple officiel. Voir l'étape E du hardware/GUIDE-EQUIPE-DUBAI.md.

board: MKS DLC32 V2.x
name: Athar Table
meta: Athar config v0.1

kinematics:
  Cartesian:

stepping:
  engine: I2S_STATIC
  # idle_ms 255 : garde les moteurs alimentés entre 2 segments (pas de perte de position)
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 1
  disable_delay_us: 0

i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17

uart0:
  txd_pin: gpio.1
  rxd_pin: gpio.3
  baud: 115200
  mode: 8N1

axes:
  shared_stepper_disable_pin: i2so.0

  # ---------- X = THETA (rotation du bras), unité = degré ----------
  # steps_per_mm = (200 pas * microstepping * rapport_réduction) / 360
  # ex : 200 * 16 * 5 (poulie 20T -> 100T) / 360 = 44.444
  x:
    # TODO: recalculer steps_per_mm avec TON rapport de réduction
    steps_per_mm: 44.444
    # 3600°/min = 10 tr/min (borne haute ; le Pi régule)
    max_rate_mm_per_min: 3600
    acceleration_mm_per_sec2: 60
    # rotation infinie : pas de limite réelle
    max_travel_mm: 100000
    soft_limits: false
    homing:
      cycle: 2
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 1200
      feed_mm_per_min: 300
    motor0:
      # capteur à effet Hall / fin de course "angle 0"
      limit_neg_pin: gpio.36
      hard_limits: false
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.1
        # driver A4988/TMC2208 enfichable : microstepping réglé par cavaliers MS1-3
        direction_pin: i2so.2

  # ---------- Y = RHO (chariot le long du bras), unité = mm ----------
  # steps_per_mm = (200 * microstepping) / (dents_poulie * pas_courroie)
  # ex : 200 * 16 / (20 * 2 mm GT2) = 80
  y:
    # TODO: steps_per_mm selon ta transmission (courroie / vis / crémaillère)
    steps_per_mm: 80
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 100
    # TODO: max_travel_mm = course réelle centre -> bord
    max_travel_mm: 300
    # le Pi borne rho dans [0,1] ; voir la note de couplage dans agent.example.yaml
    soft_limits: false
    homing:
      # rho d'abord (retour au centre), puis theta
      cycle: 1
      mpos_mm: 0
      positive_direction: false
      seek_mm_per_min: 1500
      feed_mm_per_min: 300
    motor0:
      # fin de course au CENTRE
      limit_neg_pin: gpio.35
      hard_limits: false
      pulloff_mm: 2
      stepstick:
        step_pin: i2so.5
        # ajoute :low à direction_pin si le moteur tourne à l'envers
        direction_pin: i2so.6

sdcard:
  cs_pin: gpio.15
  card_detect_pin: NO_PIN

start:
  # le Pi décide quand homer ($H)
  must_home: false
