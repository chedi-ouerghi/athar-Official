# Athar — broker MQTT (Mosquitto 2.x)
# Un seul broker : l'API et chaque table (Raspberry Pi) s'y connectent.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- Production : TLS uniquement (exigé par environment.schema.ts en hardware+prod)
listener 8883
protocol mqtt
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# --- Dev local uniquement (à supprimer en prod) : pas de TLS, lié à localhost
listener 1883 127.0.0.1

# Sessions persistantes : une commande QoS1 envoyée pendant une coupure Wi-Fi
# de la table est livrée à la reconnexion.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100
# Évite qu'une table hors ligne longtemps reçoive des vieilles commandes "start".
persistent_client_expiration 1h

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
